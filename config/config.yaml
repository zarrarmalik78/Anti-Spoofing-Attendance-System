camera:
  index: 0
  frame_width: 640
  frame_height: 480
  fps: 30

models:
  root: "models"                   # local InsightFace model root
  pack_name: "buffalo_l"           # model pack name
  providers: ["CPUExecutionProvider"]   # swap to CUDAExecutionProvider / TensorrtExecutionProvider

detection:
  confidence_threshold: 0.5

anti_spoofing:
  enabled: true
  # label index 1 = Real/Live (official minivision convention from test.py)
  # ensemble: 2.7_80x80_MiniFASNetV2.pth + 4_0_0_80x80_MiniFASNetV1SE.pth
  model_dir: "models/anti_spoofing/pt_models"
  threshold: 0.5           # liveness_score >= 0.5 → LIVE (normalised across models)
  diagnostic_every: 0      # set to e.g. 30 to print per-frame debug logs every 30 frames

recognition:
  similarity_threshold: 0.45       # cosine similarity cutoff (L2-normalized embeddings)
  stability_seconds: 1.0           # seconds face must remain recognized before marking

registration:
  num_samples: 10                  # face samples captured per student
  sample_delay_ms: 800             # ms between sample captures

attendance:
  session_based: true              # v1: session-only dedup

database:
  path: "data/attendance.db"

logging:
  level: "INFO"                    # DEBUG / INFO / WARNING / ERROR
  file: "logs/app.log"
  max_bytes: 5242880               # 5 MB
  backup_count: 3

gui:
  theme: "dark"                    # light / dark
  window_title: "Edge AI Biometric Attendance & Security OS"
  window_width: 1320
  window_height: 820
